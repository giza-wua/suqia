<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>(function(){try{var t=localStorage.getItem('zimam_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الكباري — منصة زمام الجيزة</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/01-tokens.css" />
    <link rel="stylesheet" href="../css/02-components.css" />
    <link rel="stylesheet" href="../css/03-app-components.css" />
    <link rel="stylesheet" href="../css/05-responsive.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="offline-banner" id="offline-banner"><span id="offline-icon"></span> لا يوجد اتصال بالإنترنت الآن — يمكنك المتابعة وستتم المزامنة تلقائياً عند رجوع الاتصال</div>
    <div id="admin-shell"></div>
    <div id="system-toast" class="toast"></div>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box"><h3 id="modal-title"></h3><p id="modal-message"></p><div class="modal-actions" id="modal-actions"></div></div>
    </div>

    <main class="admin-main">
        <h1 id="page-title"></h1>
        <p style="color:var(--text-muted); margin:6px 0 20px; font-size:0.85rem;">سجل بيانات الكباري الهندسية — الموقع، الأبعاد، الحالة الإنشائية.</p>

        <!-- ============ ملخّص سريع ============ -->
        <div class="mini-stats-grid" style="margin-bottom:20px;">
            <div class="stat-card" style="border-right:4px solid var(--success);" onclick="filterBridgesByCondition('good')" title="اضغط لعرض الكباري بحالة جيدة/ممتازة">
                <div class="stat-info"><h4>حالة جيدة</h4><div class="val" style="color:var(--success);" id="bridges-summary-good">-</div></div>
                <div id="stat-icon-bridge-good"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--warning);" onclick="filterBridgesByCondition('warn')" title="اضغط لعرض الكباري المحتاجة صيانة">
                <div class="stat-info"><h4>تحتاج انتباه</h4><div class="val" style="color:var(--warning);" id="bridges-summary-warn">-</div></div>
                <div id="stat-icon-bridge-warn"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--danger);" onclick="filterBridgesByCondition('bad')" title="اضغط لعرض الكباري الحرجة">
                <div class="stat-info"><h4>حرجة</h4><div class="val" style="color:var(--danger);" id="bridges-summary-bad">-</div></div>
                <div id="stat-icon-bridge-bad"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--nile-light,#1b6e64);" onclick="filterBridgesByCondition('')" title="اضغط لعرض كل الكباري">
                <div class="stat-info"><h4>الإجمالي</h4><div class="val" id="bridges-summary-total">-</div></div>
                <div id="stat-icon-bridge-total"></div>
            </div>
        </div>

        <div class="card-box">
            <div class="filter-bar" style="margin-bottom:14px;">
                <input type="text" id="filter-bridge-search" placeholder="بحث..." oninput="renderBridgesDebounced()" />
                <select id="filter-bridge-type" onchange="renderBridges()">
                    <option value="">كل الأنواع</option>
                    <option>كبري طرق</option><option>كبري سكك حديدية</option>
                    <option>عبارة مستطيلة</option><option>عبارة دائرية</option>
                    <option>كبري مشاة</option><option>أخرى</option>
                </select>
                <button class="btn-icon" id="btn-export-pdf" onclick="exportTableToPDF('bridges-table','تقرير الكباري','تقرير_الكباري')"></button>
                <button class="btn-icon" id="btn-export-excel" onclick="exportTableToExcel('bridges-table','كباري')"></button>
                <button class="btn-icon" id="btn-import-excel" onclick="document.getElementById('excel-import-panel').classList.toggle('open')"></button>
            </div>

            <!-- لوحة استيراد Excel مطوية افتراضياً — عملية غير يومية، مالهاش داعي تاخد مساحة ثابتة -->
            <div class="excel-import-panel" id="excel-import-panel" style="margin-bottom:14px;">
                <button type="button" class="btn-icon" style="margin-bottom:10px;" onclick="downloadExcelTemplate('bridges')" id="btn-download-template"></button>
                <label class="excel-drop-zone">
                    <div id="excel-drop-icon"></div>
                    <strong>اضغط لاختيار ملف Excel (.xlsx)</strong>
                    <p style="font-size:0.7rem;color:var(--clay);margin-top:6px;">الأعمدة: اسم الكبري, النوع, الموقع, الترعة/المصرف, الفتحة, العرض, الحمل, مادة الإنشاء, سنة الإنشاء, الحالة, خط العرض, خط الطول, ملاحظات</p>
                    <input type="file" id="excel-file-input" accept=".xlsx,.xls" onchange="handleExcelImport(event)" />
                </label>
            </div>
            <div class="table-responsive table-card-view">
                <table id="bridges-table">
                    <thead><tr><th>اسم الكبري</th><th>النوع</th><th>الترعة/المصرف</th><th>الموقع</th><th>الحالة</th><th>إجراءات</th></tr></thead>
                    <tbody id="bridges-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <button class="fab-add-btn" id="fab-add-bridge" onclick="openAddDialog()" title="إضافة كبري"></button>

    <div class="form-dialog-overlay" id="form-dialog-overlay">
        <div class="form-dialog">
            <div class="form-dialog-head">
                <h3><span id="dialog-icon"></span> <span id="dialog-title">إضافة كبري جديد</span></h3>
                <button class="form-dialog-close" onclick="closeFormDialog()"></button>
            </div>
            <div class="form-dialog-body">
                <input type="hidden" id="br-id" />
                <div class="form-grid">
                    <div class="form-group"><label class="form-label"><span class="required-star">*</span>اسم الكبري</label><input class="form-input" id="br-name" placeholder="كبري ترعة الحاجة" /></div>
                    <div class="form-group">
                        <label class="form-label">نوع الكبري</label>
                        <select class="form-input" id="br-bridgeType">
                            <option value="">-- اختر --</option>
                            <option>كبري طرق</option><option>كبري سكك حديدية</option>
                            <option>عبارة مستطيلة</option><option>عبارة دائرية</option>
                            <option>كبري مشاة</option><option>أخرى</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column:1/-1"><label class="form-label">الموقع</label><input class="form-input" id="br-location" placeholder="كيلو 12 - طريق الواحات" /></div>
                    <div class="form-group"><label class="form-label">الترعة / المصرف</label><input class="form-input" id="br-canalName" placeholder="ترعة الحاجة" /></div>
                    <div class="form-group"><label class="form-label">الفتحة (م)</label><input class="form-input" id="br-span" type="number" placeholder="6.0" /></div>
                    <div class="form-group"><label class="form-label">العرض (م)</label><input class="form-input" id="br-width" type="number" placeholder="4.5" /></div>
                    <div class="form-group"><label class="form-label">الحمل (طن)</label><input class="form-input" id="br-load" type="number" placeholder="20" /></div>
                    <div class="form-group"><label class="form-label">مادة الإنشاء</label><input class="form-input" id="br-material" placeholder="خرسانة مسلحة" /></div>
                    <div class="form-group"><label class="form-label">سنة الإنشاء</label><input class="form-input" id="br-buildYear" type="number" placeholder="2005" /></div>
                    <div class="form-group">
                        <label class="form-label">الحالة</label>
                        <select class="form-input" id="br-condition">
                            <option value="">-- اختر --</option>
                            <option>ممتاز</option><option>جيد</option><option>متوسط</option><option>يحتاج صيانة</option><option>حرج</option>
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">خط العرض (GPS)</label><input class="form-input" id="br-lat" type="number" step="0.000001" /></div>
                    <div class="form-group"><label class="form-label">خط الطول (GPS)</label><input class="form-input" id="br-lng" type="number" step="0.000001" /></div>
                    <div class="form-group" style="display:flex; align-items:flex-end;"><button type="button" class="btn-gps" id="btn-gps-bridge" onclick="captureGPSSeparate('br-lat','br-lng','btn-gps-bridge')" style="width:100%;"></button></div>
                    <div class="form-group" style="grid-column:1/-1"><label class="form-label">ملاحظات</label><textarea class="form-input" id="br-notes" rows="2"></textarea></div>
                </div>
            </div>
            <div class="form-dialog-foot">
                <button class="btn-submit" id="btn-save-bridge" style="flex:1;" onclick="saveBridge()"></button>
                <button class="btn-icon" id="btn-cancel-edit-bridge" style="display:none;" onclick="cancelEditBridge()">إلغاء التعديل</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth } from "../js/auth.js";
        import { initTheme, renderAdminShell } from "../js/shared.js";
        import { debounce, updateOnlineStatus } from "../js/utils/ui-helpers.js";
        import { exportTableToPDF } from "../js/utils/pdf-export.js";
        import { exportTableToExcel, downloadExcelTemplate } from "../js/utils/excel-export.js";
        import { saveBridge, cancelEditBridge, editBridgeTrigger, deleteBridge, renderBridges, initBridgesListener, filterBridgesByCondition, viewBridgeDetail, handleExcelImport } from "../js/data/bridges.js";
        import { icon } from "../js/icons.js";
        import { captureGPSSeparate } from "../js/utils/gps.js";

        document.getElementById("page-title").innerHTML = `${icon("bridge", 24)} الكباري`;
        document.getElementById("stat-icon-bridge-good").innerHTML = icon("check", 22);
        document.getElementById("stat-icon-bridge-warn").innerHTML = icon("warning", 22);
        document.getElementById("stat-icon-bridge-bad").innerHTML = icon("warning", 22);
        document.getElementById("stat-icon-bridge-total").innerHTML = icon("bridge", 22);
        document.getElementById("btn-export-pdf").innerHTML = icon("pdf", 17);
        document.getElementById("btn-export-excel").innerHTML = icon("excel", 17);
        document.getElementById("btn-import-excel").innerHTML = icon("upload", 17);
        document.getElementById("btn-download-template").innerHTML = `${icon("save", 15)} تحميل قالب Excel فاضي للتعبئة`;
        document.getElementById("excel-drop-icon").innerHTML = icon("excel", 32);
        document.getElementById("fab-add-bridge").innerHTML = icon("plus", 24);
        document.getElementById("dialog-icon").innerHTML = icon("bridge", 18);
        document.querySelector(".form-dialog-close").innerHTML = icon("close", 18);
        document.getElementById("btn-save-bridge").innerHTML = `${icon("save", 16)} حفظ`;
        document.getElementById("btn-gps-bridge").innerHTML = `${icon("location", 15)} تحديد الموقع`;

        document.getElementById("offline-icon").innerHTML = icon("warning", 15);
        initTheme();
        updateOnlineStatus();
        window._loaded = window._loaded || {};
        window.bridgesCache = window.bridgesCache || [];

        renderAdminShell("bridges"); // فوري بدون بيانات — يلغي الوميض
        const profile = await requireAuth();
        renderAdminShell("bridges", profile); // تحديث بالبيانات الحقيقية

        window.openAddDialog = function () {
            cancelEditBridge();
            document.getElementById("dialog-title").textContent = "إضافة كبري جديد";
            document.getElementById("form-dialog-overlay").classList.add("open");
        };
        window.closeFormDialog = function () {
            document.getElementById("form-dialog-overlay").classList.remove("open");
        };

        Object.assign(window, {
            saveBridge, cancelEditBridge, editBridgeTrigger, deleteBridge, renderBridges, filterBridgesByCondition, viewBridgeDetail, handleExcelImport,
            exportTableToPDF, exportTableToExcel, downloadExcelTemplate, captureGPSSeparate,
            renderBridgesDebounced: debounce(renderBridges),
        });

        initBridgesListener();
    </script>
</body>
</html>
