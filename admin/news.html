<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>(function(){try{var t=localStorage.getItem('zimam_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الأخبار — منصة زمام الجيزة</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/01-tokens.css" />
    <link rel="stylesheet" href="../css/02-components.css" />
    <link rel="stylesheet" href="../css/03-app-components.css" />
    <link rel="stylesheet" href="../css/05-responsive.css" />
</head>
<body>
    <div class="offline-banner" id="offline-banner"><span id="offline-icon"></span> لا يوجد اتصال بالإنترنت الآن — يمكنك المتابعة وستتم المزامنة تلقائياً عند رجوع الاتصال</div>
    <div id="admin-shell"></div>
    <div id="system-toast" class="toast"></div>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box"><h3 id="modal-title"></h3><p id="modal-message"></p><div class="modal-actions" id="modal-actions"></div></div>
    </div>

    <main class="admin-main">
        <h1 id="page-title"></h1>
        <p style="color:var(--text-muted); margin:6px 0 20px; font-size:0.85rem;">أخبار وإعلانات تظهر للمزارعين في الواجهة العامة.</p>

        <!-- ============ ملخّص سريع ============ -->
        <div class="mini-stats-grid" style="margin-bottom:20px;">
            <div class="stat-card" style="border-right:4px solid var(--danger);" onclick="filterNewsByType('عاجل')" title="اضغط لعرض الأخبار العاجلة فقط">
                <div class="stat-info"><h4>عاجل</h4><div class="val" style="color:var(--danger);" id="news-summary-urgent">-</div></div>
                <div id="stat-icon-news-urgent"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--success);" onclick="filterNewsByType('توعية')" title="اضغط لعرض أخبار التوعية فقط">
                <div class="stat-info"><h4>توعية</h4><div class="val" style="color:var(--success);" id="news-summary-awareness">-</div></div>
                <div id="stat-icon-news-awareness"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--info,#2563eb);" onclick="filterNewsByType('عام')" title="اضغط لعرض الأخبار العامة فقط">
                <div class="stat-info"><h4>عام</h4><div class="val" id="news-summary-general">-</div></div>
                <div id="stat-icon-news-general"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--nile-light,#1b6e64);" onclick="filterNewsByType('')" title="اضغط لعرض كل الأخبار">
                <div class="stat-info"><h4>الإجمالي</h4><div class="val" id="news-summary-total">-</div></div>
                <div id="stat-icon-news-total"></div>
            </div>
        </div>

        <div class="card-box">
            <h3 style="margin-bottom:14px;">الأخبار المنشورة</h3>
            <div class="table-responsive table-card-view">
                <table id="news-table">
                    <thead><tr><th>العنوان</th><th>النوع</th><th>النص</th><th>التاريخ</th><th>إجراء</th></tr></thead>
                    <tbody id="news-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <button class="fab-add-btn" id="fab-add-news" onclick="openAddDialog()" title="نشر خبر"></button>

    <div class="form-dialog-overlay" id="form-dialog-overlay">
        <div class="form-dialog">
            <div class="form-dialog-head">
                <h3><span id="dialog-icon"></span> <span id="dialog-title">نشر خبر جديد</span></h3>
                <button class="form-dialog-close" onclick="closeFormDialog()"></button>
            </div>
            <div class="form-dialog-body">
                <input type="hidden" id="news-id" />
                <div class="form-grid">
                    <div class="form-group"><label class="form-label">عنوان الخبر</label><input type="text" id="news-title" class="form-input" placeholder="عنوان الخبر..." /></div>
                    <div class="form-group"><label class="form-label">نوع الخبر</label><select id="news-type" class="form-input"><option value="عام">عام</option><option value="عاجل">عاجل</option><option value="توعية">توعية</option></select></div>
                </div>
                <div class="form-group"><label class="form-label">نص الرسالة</label><textarea id="news-body" class="form-input" rows="3" placeholder="نص الرسالة..."></textarea></div>
            </div>
            <div class="form-dialog-foot">
                <button class="btn-submit" id="btn-save-news" style="flex:1;" onclick="saveNews()">نشر الخبر</button>
                <button class="btn-icon" id="btn-cancel-edit-news" style="display:none;" onclick="cancelEditNews()">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { updateOnlineStatus } from "../js/utils/ui-helpers.js";
        import { requireAuth } from "../js/auth.js";
        import { initTheme, renderAdminShell } from "../js/shared.js";
        import { saveNews, cancelEditNews, editNewsTrigger, deleteNews, initNewsListener, filterNewsByType } from "../js/data/news.js";
        import { icon } from "../js/icons.js";

        document.getElementById("page-title").innerHTML = `${icon("megaphone", 24)} الأخبار`;
        document.getElementById("stat-icon-news-urgent").innerHTML = icon("warning", 22);
        document.getElementById("stat-icon-news-awareness").innerHTML = icon("check", 22);
        document.getElementById("stat-icon-news-general").innerHTML = icon("megaphone", 22);
        document.getElementById("stat-icon-news-total").innerHTML = icon("activity", 22);
        document.getElementById("fab-add-news").innerHTML = icon("plus", 24);
        document.getElementById("dialog-icon").innerHTML = icon("megaphone", 18);
        document.querySelector(".form-dialog-close").innerHTML = icon("close", 18);

        document.getElementById("offline-icon").innerHTML = icon("warning", 15);
        initTheme();
        updateOnlineStatus();
        window._loaded = window._loaded || {};
        window.newsCache = window.newsCache || [];

        renderAdminShell("news"); // فوري بدون بيانات — يلغي الوميض
        const profile = await requireAuth();
        renderAdminShell("news", profile); // تحديث بالبيانات الحقيقية

        window.openAddDialog = function () {
            cancelEditNews();
            document.getElementById("dialog-title").textContent = "نشر خبر جديد";
            document.getElementById("form-dialog-overlay").classList.add("open");
        };
        window.closeFormDialog = function () {
            document.getElementById("form-dialog-overlay").classList.remove("open");
        };

        Object.assign(window, { saveNews, cancelEditNews, editNewsTrigger, deleteNews, filterNewsByType });

        initNewsListener();
    </script>
</body>
</html>
