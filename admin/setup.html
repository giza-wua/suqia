<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>(function(){try{var t=localStorage.getItem('zimam_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الإعداد الأول — منصة زمام الجيزة</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/01-tokens.css" />
    <link rel="stylesheet" href="../css/02-components.css" />
    <link rel="stylesheet" href="../css/05-responsive.css" />
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="offline-banner" id="offline-banner" style="position:fixed; top:0; right:0; left:0;"><span id="offline-icon"></span> لا يوجد اتصال بالإنترنت الآن — يمكنك المتابعة وستتم المزامنة تلقائياً عند رجوع الاتصال</div>
    <form id="setup-form" class="login-card-animated" style="width:100%; max-width:400px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px 28px; box-shadow:var(--shadow-2);">
        <div style="text-align:center; margin-bottom:24px;">
            <img src="../assets/branding/amana-logo.png" alt="شعار الأمانة العامة" style="width:64px; height:64px; object-fit:contain; margin-bottom:10px;" />
            <h2 style="margin:0;">أهلاً بيك 👋</h2>
            <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">أول مرة تفتح فيها المنصة — أنشئ حساب المدير العام بتاعك عشان تبدأ</div>
        </div>
        <label style="font-size:0.8rem; font-weight:700; display:block; margin-bottom:6px;">اسمك</label>
        <input id="setup-name" class="form-input" type="text" required autocomplete="name" style="margin-bottom:16px;" placeholder="مثال: أحمد محمد" />
        <label style="font-size:0.8rem; font-weight:700; display:block; margin-bottom:6px;">اسم المستخدم (للدخول، حروف إنجليزية بس)</label>
        <input id="setup-username" class="form-input" type="text" required autocomplete="username" style="margin-bottom:16px;" placeholder="مثال: ahmed" dir="ltr" />
        <label style="font-size:0.8rem; font-weight:700; display:block; margin-bottom:6px;">كلمة المرور</label>
        <input id="setup-password" class="form-input" type="password" required autocomplete="new-password" style="margin-bottom:16px;" />
        <label style="font-size:0.8rem; font-weight:700; display:block; margin-bottom:6px;">تأكيد كلمة المرور</label>
        <input id="setup-password-confirm" class="form-input" type="password" required autocomplete="new-password" style="margin-bottom:20px;" />
        <div id="setup-error" style="display:none; color:var(--danger); font-size:0.8rem; font-weight:700; margin-bottom:14px;"></div>
        <button type="submit" id="setup-submit" style="width:100%; min-height:48px; border:none; border-radius:var(--radius-sm); background:var(--nile-dark); color:#fff; font-weight:800; font-size:0.95rem; cursor:pointer;">إنشاء الحساب والدخول</button>
    </form>
    <div style="position:fixed; bottom:16px; right:0; left:0; text-align:center; font-size:0.68rem; color:var(--text-muted); opacity:0.75;">تطوير: المكتب الإعلامي للأمانة العامة بمحافظة الجيزة</div>

    <script type="module">
        import { updateOnlineStatus } from "../js/utils/ui-helpers.js";
        import { completeSetup, checkNeedsSetup } from "../js/auth.js";
        import { icon } from "../js/icons.js";

        document.getElementById("offline-icon").innerHTML = icon("warning", 15);
        updateOnlineStatus();

        // لو حد فتح setup.html يدوياً بعد ما الإعداد خلص فعلاً، حوّله لصفحة الدخول العادية
        checkNeedsSetup().then((needsSetup) => {
            if (!needsSetup) window.location.replace("login.html");
        });

        const form = document.getElementById("setup-form");
        const errorBox = document.getElementById("setup-error");
        const submitBtn = document.getElementById("setup-submit");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorBox.style.display = "none";

            const name = document.getElementById("setup-name").value.trim();
            const username = document.getElementById("setup-username").value.trim();
            const password = document.getElementById("setup-password").value;
            const confirm = document.getElementById("setup-password-confirm").value;

            if (password !== confirm) {
                errorBox.textContent = "⚠️ كلمة المرور وتأكيدها غير متطابقين.";
                errorBox.style.display = "block";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الإنشاء...";
            try {
                await completeSetup(name, username, password);
                window.location.href = "dashboard.html";
            } catch (err) {
                errorBox.textContent = err.friendly ? `⚠️ ${err.message}` : "⚠️ حدث خطأ أثناء الإعداد، حاول مرة أخرى.";
                errorBox.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = "إنشاء الحساب والدخول";
            }
        });
    </script>
</body>
</html>
