<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>(function(){try{var t=localStorage.getItem('zimam_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المساقي المائية — منصة زمام الجيزة</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/01-tokens.css" />
    <link rel="stylesheet" href="../css/02-components.css" />
    <link rel="stylesheet" href="../css/03-app-components.css" />
    <link rel="stylesheet" href="../css/05-responsive.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="offline-banner" id="offline-banner"><span id="offline-icon"></span> لا يوجد اتصال بالإنترنت الآن — يمكنك المتابعة وستتم المزامنة تلقائياً عند رجوع الاتصال</div>
    <div id="admin-shell"></div>
    <div id="system-toast" class="toast"></div>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box"><h3 id="modal-title"></h3><p id="modal-message"></p><div class="modal-actions" id="modal-actions"></div></div>
    </div>

    <main class="admin-main">
        <h1 id="page-title"></h1>
        <p style="color:var(--text-muted); margin:6px 0 20px; font-size:0.85rem;">سجل المساقي وحالة تطهيرها لكل هندسة ري.</p>

        <!-- ============ ملخّص سريع ============ -->
        <div class="mini-stats-grid" style="margin-bottom:20px;">
            <div class="stat-card" style="border-right:4px solid var(--danger);" onclick="filterMasaqiByStatus('تحتاج للتطهير')" title="اضغط لعرض المساقي المحتاجة للتطهير فقط">
                <div class="stat-info"><h4>تحتاج للتطهير</h4><div class="val" style="color:var(--danger);" id="masaqi-summary-critical">-</div></div>
                <div id="stat-icon-critical"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--warning);" onclick="filterMasaqiByStatus('قيد العمل')" title="اضغط لعرض المساقي قيد العمل فقط">
                <div class="stat-info"><h4>جاري التطهير</h4><div class="val" style="color:var(--warning);" id="masaqi-summary-progress">-</div></div>
                <div id="stat-icon-progress"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--success);" onclick="filterMasaqiByStatus('تم التطهير')" title="اضغط لعرض المساقي المُطهَّرة فقط">
                <div class="stat-info"><h4>تم التطهير</h4><div class="val" style="color:var(--success);" id="masaqi-summary-done">-</div></div>
                <div id="stat-icon-done"></div>
            </div>
        </div>

        <!-- ============ جدول المساقي (المحتوى الرئيسي — الفورم بقى في ديالوج) ============ -->
        <div class="card-box">
            <div class="filter-bar" style="margin-bottom:14px;">
                <input type="text" id="filter-masqa-search" placeholder="بحث..." oninput="renderMasaqiDebounced()" />
                <select id="filter-masqa-directorate" onchange="renderMasaqi()">
                    <option value="">كل الهندسات</option>
                    <option>هندسة ري مزغونة</option><option>هندسة ري العياط</option><option>هندسة ري الجيزة</option>
                    <option>هندسة ري المنصورية</option><option>هندسة ري إمبابة</option><option>هندسة ري الرياح</option>
                </select>
                <select id="filter-masqa-status" onchange="renderMasaqi()">
                    <option value="">كل الحالات</option>
                    <option value="تحتاج للتطهير">تحتاج للتطهير</option>
                    <option value="قيد العمل">جاري التطهير</option>
                    <option value="تم التطهير">تم التطهير</option>
                </select>
                <button class="btn-icon" id="btn-export-pdf" onclick="exportTableToPDF('masaqi-table','تقرير المساقي المائية','تقرير_المساقي')"></button>
                <button class="btn-icon" id="btn-export-excel" onclick="exportTableToExcel('masaqi-table','مساقي_مائية')"></button>
                <button class="btn-icon" id="btn-import-excel" onclick="document.getElementById('excel-import-panel').classList.toggle('open')"></button>
            </div>

            <!-- لوحة استيراد Excel مطوية افتراضياً — عملية غير يومية، مالهاش داعي تاخد مساحة ثابتة -->
            <div class="excel-import-panel" id="excel-import-panel" style="margin-bottom:14px;">
                <button type="button" class="btn-icon" style="margin-bottom:10px;" onclick="downloadExcelTemplate('masaqi')" id="btn-download-template"></button>
                <label class="excel-drop-zone">
                    <div id="excel-drop-icon"></div>
                    <strong>اضغط لاختيار ملف Excel (.xlsx)</strong>
                    <p style="font-size:0.7rem;color:var(--clay);margin-top:6px;">الأعمدة: المسقى, الهندسة, القرية, الترعة, الزمام, الطول, الحالة, تاريخ التطهير, الموقع</p>
                    <input type="file" id="excel-file-input" accept=".xlsx,.xls" onchange="handleExcelImport(event)" />
                </label>
            </div>

            <div class="table-responsive table-card-view">
                <table id="masaqi-table">
                    <thead><tr>
                        <th>المسقى</th><th>الهندسة</th><th>القرية</th><th>الزمام</th><th>الطول</th><th>الحالة</th><th>الموقع</th><th>تاريخ التطهير</th><th>إجراءات</th>
                    </tr></thead>
                    <tbody id="masaqi-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ============ زرار الإضافة العائم ============ -->
    <button class="fab-add-btn" id="fab-add-masqa" onclick="openAddDialog()" title="إضافة مسقى"></button>

    <!-- ============ ديالوج إضافة/تعديل مسقى ============ -->
    <div class="form-dialog-overlay" id="form-dialog-overlay">
        <div class="form-dialog">
            <div class="form-dialog-head">
                <h3><span id="dialog-icon"></span> <span id="dialog-title">إضافة مسقى جديد</span></h3>
                <button class="form-dialog-close" onclick="closeFormDialog()"></button>
            </div>
            <div class="form-dialog-body">
                <input type="hidden" id="ms-id" value="" />
                <div class="form-section-label" id="fsl-1"></div>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label"><span class="required-star">*</span>الهندسة</label>
                        <select id="ms-directorate" class="form-input" onchange="updateWatercourseDropdown('ms')">
                            <option value="">اختر الهندسة</option>
                            <option>هندسة ري مزغونة</option><option>هندسة ري العياط</option><option>هندسة ري الجيزة</option>
                            <option>هندسة ري المنصورية</option><option>هندسة ري إمبابة</option><option>هندسة ري الرياح</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label"><span class="required-star">*</span>المسقى</label>
                        <select id="ms-name" class="form-input" onchange="handleMsNameOther()">
                            <option value="">اختر الهندسة أولاً</option>
                        </select>
                        <input type="text" id="ms-name-other" class="form-input" placeholder="أدخل اسم المسقى الجديد" style="display:none;margin-top:6px;" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">القرية</label>
                        <input type="text" id="ms-village" class="form-input" />
                    </div>
                </div>

                <div class="form-section-label" id="fsl-2"></div>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">الترعة التابع لها</label>
                        <input type="text" id="ms-canal" class="form-input" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">حالة التطهير</label>
                        <select id="ms-status" class="form-input">
                            <option value="تحتاج للتطهير">تحتاج للتطهير</option>
                            <option value="تم التطهير">تم التطهير</option>
                            <option value="قيد العمل">جاري التطهير</option>
                        </select>
                    </div>
                </div>

                <div class="form-section-label" id="fsl-3"></div>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">الموقع GPS</label>
                        <div style="display:flex; gap:8px;">
                            <input type="text" id="ms-gps" class="form-input" placeholder="29.8123, 31.2345" readonly />
                            <button type="button" class="btn-gps" id="btn-gps-masqa" onclick="captureGPS('ms-gps','btn-gps-masqa')"></button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">تاريخ آخر تطهير</label>
                        <input type="date" id="ms-date" class="form-input" />
                    </div>
                </div>

                <div class="form-section-label" id="fsl-4"></div>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">الزمام (فدان)</label>
                        <input type="text" id="ms-zamam" class="form-input" inputmode="decimal" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">الطول (متر)</label>
                        <input type="text" id="ms-length" class="form-input" inputmode="decimal" />
                    </div>
                </div>
            </div>
            <div class="form-dialog-foot">
                <button class="btn-submit" id="btn-save-masqa" style="flex:1;" onclick="saveMasqa()"></button>
                <button class="btn-icon" id="btn-cancel-edit" style="display:none;" onclick="cancelEditMasqa()">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth } from "../js/auth.js";
        import { initTheme, renderAdminShell } from "../js/shared.js";
        import { debounce, updateWatercourseDropdown, handleMsNameOther, updateOnlineStatus } from "../js/utils/ui-helpers.js";
        import { captureGPS } from "../js/utils/gps.js";
        import { exportTableToPDF } from "../js/utils/pdf-export.js";
        import { exportTableToExcel, downloadExcelTemplate } from "../js/utils/excel-export.js";
        import {
            saveMasqa, cancelEditMasqa, editMasqaTrigger, deleteMasqa,
            handleExcelImport, renderMasaqi, filterMasaqiByStatus, initMasaqiListener, viewMasqaDetail,
        } from "../js/data/masaqi.js";
        import { icon } from "../js/icons.js";

        // ============ حقن الأيقونات (بدل الإيموجي) ============
        document.getElementById("page-title").innerHTML = `${icon("droplet", 24)} المساقي المائية`;
        document.getElementById("stat-icon-critical").innerHTML = icon("warning", 22);
        document.getElementById("stat-icon-progress").innerHTML = icon("activity", 22);
        document.getElementById("stat-icon-done").innerHTML = icon("check", 22);
        document.getElementById("btn-export-pdf").innerHTML = icon("pdf", 17);
        document.getElementById("btn-export-excel").innerHTML = icon("excel", 17);
        document.getElementById("btn-import-excel").innerHTML = icon("upload", 17);
        document.getElementById("btn-download-template").innerHTML = `${icon("save", 15)} تحميل قالب Excel فاضي للتعبئة`;
        document.getElementById("excel-drop-icon").innerHTML = icon("excel", 32);
        document.getElementById("fab-add-masqa").innerHTML = icon("plus", 24);
        document.getElementById("dialog-icon").innerHTML = icon("droplet", 18);
        document.querySelector(".form-dialog-close").innerHTML = icon("close", 18);
        document.getElementById("fsl-1").innerHTML = `${icon("location", 14)} الموقع والتصنيف`;
        document.getElementById("fsl-2").innerHTML = `${icon("tractor", 14)} الترعة وحالة التطهير`;
        document.getElementById("fsl-3").innerHTML = `${icon("location", 14)} الموقع والتاريخ`;
        document.getElementById("fsl-4").innerHTML = `${icon("filter", 14)} القياسات`;
        document.getElementById("btn-gps-masqa").innerHTML = `${icon("location", 15)} التقاط`;
        document.getElementById("btn-save-masqa").innerHTML = `${icon("save", 16)} حفظ`;

        document.getElementById("offline-icon").innerHTML = icon("warning", 15);
        initTheme();
        updateOnlineStatus();
        window._loaded = window._loaded || {};
        window.masaqiCache = window.masaqiCache || [];

        renderAdminShell("masaqi"); // فوري بدون بيانات — يلغي الوميض
        const profile = await requireAuth();
        renderAdminShell("masaqi", profile); // تحديث بالبيانات الحقيقية

        // ============ فتح/إغلاق ديالوج الإضافة ============
        window.openAddDialog = function () {
            cancelEditMasqa();
            document.getElementById("dialog-title").textContent = "إضافة مسقى جديد";
            document.getElementById("form-dialog-overlay").classList.add("open");
        };
        window.closeFormDialog = function () {
            document.getElementById("form-dialog-overlay").classList.remove("open");
        };

        Object.assign(window, {
            saveMasqa, cancelEditMasqa, editMasqaTrigger, deleteMasqa, viewMasqaDetail,
            handleExcelImport, renderMasaqi, filterMasaqiByStatus,
            updateWatercourseDropdown, handleMsNameOther, captureGPS,
            exportTableToPDF, exportTableToExcel, downloadExcelTemplate,
            renderMasaqiDebounced: debounce(renderMasaqi),
        });

        updateWatercourseDropdown("ms");
        initMasaqiListener();
    </script>
</body>
</html>
