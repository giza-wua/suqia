<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>(function(){try{var t=localStorage.getItem('zimam_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أعضاء الروابط — منصة زمام الجيزة</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/01-tokens.css" />
    <link rel="stylesheet" href="../css/02-components.css" />
    <link rel="stylesheet" href="../css/03-app-components.css" />
    <link rel="stylesheet" href="../css/05-responsive.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="offline-banner" id="offline-banner"><span id="offline-icon"></span> لا يوجد اتصال بالإنترنت الآن — يمكنك المتابعة وستتم المزامنة تلقائياً عند رجوع الاتصال</div>
    <div id="admin-shell"></div>
    <div id="system-toast" class="toast"></div>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box"><h3 id="modal-title"></h3><p id="modal-message"></p><div class="modal-actions" id="modal-actions"></div></div>
    </div>

    <main class="admin-main">
        <h1 id="page-title"></h1>
        <p style="color:var(--text-muted); margin:6px 0 20px; font-size:0.85rem;">سجل أعضاء روابط مستخدمي المياه المسجَّلين وصفاتهم.</p>

        <!-- ============ ملخّص سريع ============ -->
        <div class="mini-stats-grid" style="margin-bottom:20px;">
            <div class="stat-card" style="border-right:4px solid var(--nile-light,#1b6e64);">
                <div class="stat-info"><h4>إجمالي الأعضاء</h4><div class="val" id="members-summary-total">-</div></div>
                <div id="stat-icon-member-total"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--success);">
                <div class="stat-info"><h4>إجمالي الحيازة (فدان)</h4><div class="val" id="members-summary-holding">-</div></div>
                <div id="stat-icon-member-holding"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--info,#2563eb);">
                <div class="stat-info"><h4>عدد الهندسات</h4><div class="val" id="members-summary-dir">-</div></div>
                <div id="stat-icon-member-dir"></div>
            </div>
        </div>

        <div class="card-box">
            <div class="filter-bar" style="margin-bottom:14px;">
                <input type="text" id="filter-member-search" placeholder="بحث..." oninput="renderMembersDebounced()" />
                <select id="filter-member-directorate" onchange="renderMembers()">
                    <option value="">كل الهندسات</option>
                    <option>هندسة ري مزغونة</option><option>هندسة ري العياط</option><option>هندسة ري الجيزة</option>
                    <option>هندسة ري المنصورية</option><option>هندسة ري إمبابة</option><option>هندسة ري الرياح</option>
                </select>
                <button class="btn-icon" id="btn-export-pdf" onclick="exportTableToPDF('members-table','تقرير أعضاء الروابط','تقرير_الأعضاء')"></button>
                <button class="btn-icon" id="btn-export-excel" onclick="exportTableToExcel('members-table','أعضاء_الروابط')"></button>
                <button class="btn-icon" id="btn-import-excel" onclick="document.getElementById('excel-import-panel').classList.toggle('open')"></button>
            </div>

            <div class="excel-import-panel" id="excel-import-panel" style="margin-bottom:14px;">
                <button type="button" class="btn-icon" style="margin-bottom:10px;" onclick="downloadExcelTemplate('members')" id="btn-download-template"></button>
                <label class="excel-drop-zone">
                    <div id="excel-drop-icon"></div>
                    <strong>اضغط لاختيار ملف Excel (.xlsx)</strong>
                    <p style="font-size:0.7rem;color:var(--clay);margin-top:6px;">الأعمدة: الاسم, الهاتف, الرقم القومي, الهندسة, القرية, الصفة, المسقى, الحيازة</p>
                    <input type="file" id="excel-file-input-members" accept=".xlsx,.xls" onchange="handleExcelImportMembers(event)" />
                </label>
            </div>

            <div class="table-responsive table-card-view">
                <table id="members-table">
                    <thead><tr><th>الاسم</th><th>الصفة</th><th>الهندسة</th><th>القرية</th><th>المسقى</th><th>الهاتف</th><th>الحيازة</th><th>إجراءات</th></tr></thead>
                    <tbody id="members-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <button class="fab-add-btn" id="fab-add-member" onclick="openAddDialog()" title="إضافة عضو"></button>

    <div class="form-dialog-overlay" id="form-dialog-overlay">
        <div class="form-dialog">
            <div class="form-dialog-head">
                <h3><span id="dialog-icon"></span> <span id="dialog-title">إضافة عضو جديد</span></h3>
                <button class="form-dialog-close" onclick="closeFormDialog()"></button>
            </div>
            <div class="form-dialog-body">
                <input type="hidden" id="m-id" />
                <div class="form-grid">
                    <div class="form-group"><label class="form-label"><span class="required-star">*</span>الاسم بالكامل</label><input type="text" id="m-name" class="form-input" /></div>
                    <div class="form-group"><label class="form-label"><span class="required-star">*</span>رقم الهاتف</label><input type="tel" id="m-phone" class="form-input" inputmode="numeric" maxlength="11" /></div>
                    <div class="form-group"><label class="form-label">الرقم القومي</label><input type="text" id="m-national-id" class="form-input" inputmode="numeric" maxlength="14" /></div>
                    <div class="form-group"><label class="form-label">الهندسة</label><select id="m-directorate" class="form-input"><option>هندسة ري مزغونة</option><option>هندسة ري العياط</option><option>هندسة ري الجيزة</option><option>هندسة ري المنصورية</option><option>هندسة ري إمبابة</option><option>هندسة ري الرياح</option></select></div>
                    <div class="form-group"><label class="form-label">القرية</label><input type="text" id="m-village" class="form-input" /></div>
                    <div class="form-group">
                        <label class="form-label">الصفة</label>
                        <select id="m-role" class="form-input" onchange="handleMemberRoleOther()">
                            <option value="">اختر الصفة</option>
                            <option value="أمين عام المحافظة">أمين عام المحافظة</option><option value="أمين هندسة/مركز">أمين هندسة/مركز</option>
                            <option value="رئيس الرابطة">رئيس الرابطة</option><option value="سكرتير">سكرتير</option>
                            <option value="أمين الصندوق">أمين الصندوق</option><option value="عضو مجلس إدارة">عضو مجلس إدارة</option>
                            <option value="منسق إعلامي">منسق إعلامي</option><option value="منسق ميداني">منسق ميداني</option>
                            <option value="عضو متطوع">عضو متطوع</option><option value="__OTHER__">أخرى (كتابة يدوية)</option>
                        </select>
                        <input type="text" id="m-role-other" class="form-input" placeholder="اكتب الصفة" style="display:none;margin-top:8px;" />
                    </div>
                    <div class="form-group"><label class="form-label">المسقى المرتبط</label><input type="text" id="m-masqa" class="form-input" /></div>
                    <div class="form-group"><label class="form-label">الحيازة (فدان)</label><input type="number" id="m-holding" class="form-input" placeholder="0" inputmode="decimal" /></div>
                </div>
            </div>
            <div class="form-dialog-foot">
                <button class="btn-submit" id="btn-save-member" style="flex:1;" onclick="saveMember()"></button>
                <button class="btn-icon" id="btn-cancel-edit-member" style="display:none;" onclick="cancelEditMember()">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth } from "../js/auth.js";
        import { initTheme, renderAdminShell } from "../js/shared.js";
        import { debounce, handleMemberRoleOther, updateOnlineStatus } from "../js/utils/ui-helpers.js";
        import { exportTableToPDF } from "../js/utils/pdf-export.js";
        import { exportTableToExcel, downloadExcelTemplate } from "../js/utils/excel-export.js";
        import {
            saveMember, cancelEditMember, editMemberTrigger, deleteMember,
            handleExcelImportMembers, renderMembers, initMembersListener,
        } from "../js/data/members.js";
        import { icon } from "../js/icons.js";

        document.getElementById("page-title").innerHTML = `${icon("users", 24)} أعضاء الروابط`;
        document.getElementById("stat-icon-member-total").innerHTML = icon("users", 22);
        document.getElementById("stat-icon-member-holding").innerHTML = icon("activity", 22);
        document.getElementById("stat-icon-member-dir").innerHTML = icon("check", 22);
        document.getElementById("btn-export-pdf").innerHTML = icon("pdf", 17);
        document.getElementById("btn-export-excel").innerHTML = icon("excel", 17);
        document.getElementById("btn-import-excel").innerHTML = icon("upload", 17);
        document.getElementById("btn-download-template").innerHTML = `${icon("save", 15)} تحميل قالب Excel فاضي للتعبئة`;
        document.getElementById("excel-drop-icon").innerHTML = icon("excel", 32);
        document.getElementById("fab-add-member").innerHTML = icon("plus", 24);
        document.getElementById("dialog-icon").innerHTML = icon("users", 18);
        document.querySelector(".form-dialog-close").innerHTML = icon("close", 18);
        document.getElementById("btn-save-member").innerHTML = `${icon("save", 16)} حفظ العضو`;

        document.getElementById("offline-icon").innerHTML = icon("warning", 15);
        initTheme();
        updateOnlineStatus();
        window._loaded = window._loaded || {};
        window.membersCache = window.membersCache || [];

        renderAdminShell("members"); // فوري بدون بيانات — يلغي الوميض
        const profile = await requireAuth();
        renderAdminShell("members", profile); // تحديث بالبيانات الحقيقية

        window.openAddDialog = function () {
            cancelEditMember();
            document.getElementById("dialog-title").textContent = "إضافة عضو جديد";
            document.getElementById("form-dialog-overlay").classList.add("open");
        };
        window.closeFormDialog = function () {
            document.getElementById("form-dialog-overlay").classList.remove("open");
        };

        Object.assign(window, {
            saveMember, cancelEditMember, editMemberTrigger, deleteMember,
            handleExcelImportMembers, renderMembers, handleMemberRoleOther,
            exportTableToPDF, exportTableToExcel, downloadExcelTemplate,
            renderMembersDebounced: debounce(renderMembers),
        });

        initMembersListener();
    </script>
</body>
</html>
