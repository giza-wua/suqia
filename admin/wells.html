<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>(function(){try{var t=localStorage.getItem('zimam_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الآبار الجوفية — منصة زمام الجيزة</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/01-tokens.css" />
    <link rel="stylesheet" href="../css/02-components.css" />
    <link rel="stylesheet" href="../css/03-app-components.css" />
    <link rel="stylesheet" href="../css/05-responsive.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="offline-banner" id="offline-banner"><span id="offline-icon"></span> لا يوجد اتصال بالإنترنت الآن — يمكنك المتابعة وستتم المزامنة تلقائياً عند رجوع الاتصال</div>
    <div id="admin-shell"></div>
    <div id="system-toast" class="toast"></div>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box"><h3 id="modal-title"></h3><p id="modal-message"></p><div class="modal-actions" id="modal-actions"></div></div>
    </div>

    <main class="admin-main">
        <h1 id="page-title"></h1>
        <p style="color:var(--text-muted); margin:6px 0 20px; font-size:0.85rem;">سجل بيانات الآبار الجوفية — العمق، الطاقة، حالة التشغيل.</p>

        <!-- ============ ملخّص سريع ============ -->
        <div class="mini-stats-grid" style="margin-bottom:20px;">
            <div class="stat-card" style="border-right:4px solid var(--success);" onclick="filterWellsByCondition('good')" title="اضغط لعرض الآبار العاملة بكفاءة">
                <div class="stat-info"><h4>يعمل بكفاءة</h4><div class="val" style="color:var(--success);" id="wells-summary-good">-</div></div>
                <div id="stat-icon-well-good"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--warning);" onclick="filterWellsByCondition('warn')" title="اضغط لعرض الآبار المتوقفة جزئياً أو قيد الإنشاء">
                <div class="stat-info"><h4>تحتاج انتباه</h4><div class="val" style="color:var(--warning);" id="wells-summary-warn">-</div></div>
                <div id="stat-icon-well-warn"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--danger);" onclick="filterWellsByCondition('bad')" title="اضغط لعرض الآبار خارج الخدمة">
                <div class="stat-info"><h4>خارج الخدمة</h4><div class="val" style="color:var(--danger);" id="wells-summary-bad">-</div></div>
                <div id="stat-icon-well-bad"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--nile-light,#1b6e64);" onclick="filterWellsByCondition('')" title="اضغط لعرض كل الآبار">
                <div class="stat-info"><h4>الإجمالي</h4><div class="val" id="wells-summary-total">-</div></div>
                <div id="stat-icon-well-total"></div>
            </div>
        </div>

        <div class="card-box">
            <div class="filter-bar" style="margin-bottom:14px;">
                <input type="text" id="filter-well-search" placeholder="بحث..." oninput="renderWellsDebounced()" />
                <input type="text" id="filter-well-district" placeholder="فلترة بالمركز..." oninput="renderWellsDebounced()" />
                <button class="btn-icon" id="btn-export-pdf" onclick="exportTableToPDF('wells-table','تقرير الآبار الجوفية','تقرير_الآبار')"></button>
                <button class="btn-icon" id="btn-export-excel" onclick="exportTableToExcel('wells-table','آبار')"></button>
                <button class="btn-icon" id="btn-import-excel" onclick="document.getElementById('excel-import-panel').classList.toggle('open')"></button>
            </div>

            <!-- لوحة استيراد Excel مطوية افتراضياً — عملية غير يومية، مالهاش داعي تاخد مساحة ثابتة -->
            <div class="excel-import-panel" id="excel-import-panel" style="margin-bottom:14px;">
                <button type="button" class="btn-icon" style="margin-bottom:10px;" onclick="downloadExcelTemplate('wells')" id="btn-download-template"></button>
                <label class="excel-drop-zone">
                    <div id="excel-drop-icon"></div>
                    <strong>اضغط لاختيار ملف Excel (.xlsx)</strong>
                    <p style="font-size:0.7rem;color:var(--clay);margin-top:6px;">الأعمدة: اسم البئر, المركز, الموقع, الغرض, العمق, القطر, المنسوب الحرج, الطاقة التصميمية, الطاقة الفعلية, نوع الطلمبة, قدرة الطلمبة, سنة الحفر, الحالة, خط العرض, خط الطول, ملاحظات</p>
                    <input type="file" id="excel-file-input" accept=".xlsx,.xls" onchange="handleExcelImport(event)" />
                </label>
            </div>
            <div class="table-responsive table-card-view">
                <table id="wells-table">
                    <thead><tr><th>اسم البئر</th><th>المركز</th><th>الغرض</th><th>العمق (م)</th><th>الحالة</th><th>إجراءات</th></tr></thead>
                    <tbody id="wells-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <button class="fab-add-btn" id="fab-add-well" onclick="openAddDialog()" title="إضافة بئر"></button>

    <div class="form-dialog-overlay" id="form-dialog-overlay">
        <div class="form-dialog">
            <div class="form-dialog-head">
                <h3><span id="dialog-icon"></span> <span id="dialog-title">إضافة بئر جديد</span></h3>
                <button class="form-dialog-close" onclick="closeFormDialog()"></button>
            </div>
            <div class="form-dialog-body">
                <input type="hidden" id="wl-id" />
                <div class="form-grid">
                    <div class="form-group"><label class="form-label"><span class="required-star">*</span>اسم البئر</label><input class="form-input" id="wl-name" placeholder="بئر قرية المنصورية" /></div>
                    <div class="form-group"><label class="form-label">المركز</label><input class="form-input" id="wl-district" placeholder="كرداسة" /></div>
                    <div class="form-group" style="grid-column:1/-1"><label class="form-label">الموقع</label><input class="form-input" id="wl-location" placeholder="شارع النيل - قرية المنصورية" /></div>
                    <div class="form-group"><label class="form-label">النوع / الغرض</label><input class="form-input" id="wl-purpose" placeholder="شرب / زراعة" /></div>
                    <div class="form-group"><label class="form-label">العمق (م)</label><input class="form-input" id="wl-depth" type="number" placeholder="120" /></div>
                    <div class="form-group"><label class="form-label">القطر (بوصة)</label><input class="form-input" id="wl-diameter" type="number" placeholder="8" /></div>
                    <div class="form-group"><label class="form-label">المنسوب الحرج (م)</label><input class="form-input" id="wl-waterLevel" type="number" placeholder="15.5" /></div>
                    <div class="form-group"><label class="form-label">الطاقة التصميمية (م³/يوم)</label><input class="form-input" id="wl-designCapacity" type="number" placeholder="500" /></div>
                    <div class="form-group"><label class="form-label">الطاقة الفعلية (م³/يوم)</label><input class="form-input" id="wl-actualCapacity" type="number" placeholder="450" /></div>
                    <div class="form-group"><label class="form-label">نوع الطلمبة</label><input class="form-input" id="wl-pumpType" placeholder="غاطسة" /></div>
                    <div class="form-group"><label class="form-label">قدرة الطلمبة (حصان)</label><input class="form-input" id="wl-pumpPower" type="number" placeholder="30" /></div>
                    <div class="form-group"><label class="form-label">سنة الحفر</label><input class="form-input" id="wl-drillYear" type="number" placeholder="2015" /></div>
                    <div class="form-group">
                        <label class="form-label">الحالة</label>
                        <select class="form-input" id="wl-condition">
                            <option value="">-- اختر --</option>
                            <option>يعمل بكفاءة</option><option>يعمل جزئياً</option>
                            <option>متوقف مؤقت</option><option>خارج الخدمة</option><option>قيد الإنشاء</option>
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">خط العرض (GPS)</label><input class="form-input" id="wl-lat" type="number" step="0.000001" /></div>
                    <div class="form-group"><label class="form-label">خط الطول (GPS)</label><input class="form-input" id="wl-lng" type="number" step="0.000001" /></div>
                    <div class="form-group" style="display:flex; align-items:flex-end;"><button type="button" class="btn-gps" id="btn-gps-well" onclick="captureGPSSeparate('wl-lat','wl-lng','btn-gps-well')" style="width:100%;"></button></div>
                    <div class="form-group" style="grid-column:1/-1"><label class="form-label">ملاحظات</label><textarea class="form-input" id="wl-notes" rows="2"></textarea></div>
                </div>
            </div>
            <div class="form-dialog-foot">
                <button class="btn-submit" id="btn-save-well" style="flex:1;" onclick="saveWell()"></button>
                <button class="btn-icon" id="btn-cancel-edit-well" style="display:none;" onclick="cancelEditWell()">إلغاء التعديل</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth } from "../js/auth.js";
        import { initTheme, renderAdminShell } from "../js/shared.js";
        import { debounce, updateOnlineStatus } from "../js/utils/ui-helpers.js";
        import { exportTableToPDF } from "../js/utils/pdf-export.js";
        import { exportTableToExcel, downloadExcelTemplate } from "../js/utils/excel-export.js";
        import { saveWell, cancelEditWell, editWellTrigger, deleteWell, renderWells, initWellsListener, filterWellsByCondition, viewWellDetail, handleExcelImport } from "../js/data/wells.js";
        import { icon } from "../js/icons.js";
        import { captureGPSSeparate } from "../js/utils/gps.js";

        document.getElementById("page-title").innerHTML = `${icon("well", 24)} الآبار الجوفية`;
        document.getElementById("stat-icon-well-good").innerHTML = icon("check", 22);
        document.getElementById("stat-icon-well-warn").innerHTML = icon("warning", 22);
        document.getElementById("stat-icon-well-bad").innerHTML = icon("warning", 22);
        document.getElementById("stat-icon-well-total").innerHTML = icon("well", 22);
        document.getElementById("btn-export-pdf").innerHTML = icon("pdf", 17);
        document.getElementById("btn-export-excel").innerHTML = icon("excel", 17);
        document.getElementById("btn-import-excel").innerHTML = icon("upload", 17);
        document.getElementById("btn-download-template").innerHTML = `${icon("save", 15)} تحميل قالب Excel فاضي للتعبئة`;
        document.getElementById("excel-drop-icon").innerHTML = icon("excel", 32);
        document.getElementById("fab-add-well").innerHTML = icon("plus", 24);
        document.getElementById("dialog-icon").innerHTML = icon("well", 18);
        document.querySelector(".form-dialog-close").innerHTML = icon("close", 18);
        document.getElementById("btn-save-well").innerHTML = `${icon("save", 16)} حفظ`;
        document.getElementById("btn-gps-well").innerHTML = `${icon("location", 15)} تحديد الموقع`;

        document.getElementById("offline-icon").innerHTML = icon("warning", 15);
        initTheme();
        updateOnlineStatus();
        window._loaded = window._loaded || {};
        window.wellsCache = window.wellsCache || [];

        renderAdminShell("wells"); // فوري بدون بيانات — يلغي الوميض
        const profile = await requireAuth();
        renderAdminShell("wells", profile); // تحديث بالبيانات الحقيقية

        window.openAddDialog = function () {
            cancelEditWell();
            document.getElementById("dialog-title").textContent = "إضافة بئر جديد";
            document.getElementById("form-dialog-overlay").classList.add("open");
        };
        window.closeFormDialog = function () {
            document.getElementById("form-dialog-overlay").classList.remove("open");
        };

        Object.assign(window, {
            saveWell, cancelEditWell, editWellTrigger, deleteWell, renderWells, filterWellsByCondition, viewWellDetail, handleExcelImport,
            exportTableToPDF, exportTableToExcel, downloadExcelTemplate, captureGPSSeparate,
            renderWellsDebounced: debounce(renderWells),
        });

        initWellsListener();
    </script>
</body>
</html>
