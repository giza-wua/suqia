<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>(function(){try{var t=localStorage.getItem('zimam_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دخول الإدارة — منصة زمام الجيزة</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/01-tokens.css" />
    <link rel="stylesheet" href="../css/02-components.css" />
    <link rel="stylesheet" href="../css/05-responsive.css" />
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="offline-banner" id="offline-banner" style="position:fixed; top:0; right:0; left:0;"><span id="offline-icon"></span> لا يوجد اتصال بالإنترنت الآن — يمكنك المتابعة وستتم المزامنة تلقائياً عند رجوع الاتصال</div>
    <form id="login-form" class="login-card-animated" style="width:100%; max-width:380px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px 28px; box-shadow:var(--shadow-2);">
        <div style="text-align:center; margin-bottom:24px;">
            <img src="../assets/branding/amana-logo.png" alt="شعار الأمانة العامة" style="width:64px; height:64px; object-fit:contain; margin-bottom:10px;" />
            <h2 style="margin:0;">دخول الإدارة</h2>
            <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;" id="login-app-name">منصة زمام الجيزة</div>
        </div>
        <label style="font-size:0.8rem; font-weight:700; display:block; margin-bottom:6px;">اسم المستخدم</label>
        <input id="login-username" class="form-input" type="text" required autocomplete="username" style="margin-bottom:16px;" />
        <label style="font-size:0.8rem; font-weight:700; display:block; margin-bottom:6px;">كلمة المرور</label>
        <input id="login-password" class="form-input" type="password" required autocomplete="current-password" style="margin-bottom:20px;" />
        <div id="login-error" style="display:none; color:var(--danger); font-size:0.8rem; font-weight:700; margin-bottom:14px;"></div>
        <button type="submit" id="login-submit" style="width:100%; min-height:48px; border:none; border-radius:var(--radius-sm); background:var(--nile-dark); color:#fff; font-weight:800; font-size:0.95rem; cursor:pointer;">دخول</button>
    </form>
    <div style="position:fixed; bottom:16px; right:0; left:0; text-align:center; font-size:0.68rem; color:var(--text-muted); opacity:0.75;">تطوير: المكتب الإعلامي للأمانة العامة بمحافظة الجيزة</div>

    <script type="module">
        import { updateOnlineStatus } from "../js/utils/ui-helpers.js";
        import { loginUser, checkNeedsSetup } from "../js/auth.js";
        import { APP_NAME_VERSIONED, APP_VERSION } from "../js/version.js";
        import { icon } from "../js/icons.js";

        document.getElementById("login-app-name").textContent = APP_NAME_VERSIONED;
        if (!document.title.includes(APP_VERSION)) document.title = `${document.title} — ${APP_VERSION}`;
        document.getElementById("offline-icon").innerHTML = icon("warning", 15);
        updateOnlineStatus();

        // أول مرة يُفتح فيها الموقع (مفيش أي مستخدم لسه)، حوّل مباشرة لصفحة الإعداد
        checkNeedsSetup().then((needsSetup) => {
            if (needsSetup) window.location.replace("setup.html");
        });

        const form = document.getElementById("login-form");
        const errorBox = document.getElementById("login-error");
        const submitBtn = document.getElementById("login-submit");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorBox.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الدخول...";
            try {
                await loginUser(
                    document.getElementById("login-username").value,
                    document.getElementById("login-password").value
                );
                const params = new URLSearchParams(location.search);
                window.location.href = params.get("redirect") || "dashboard.html";
            } catch (err) {
                errorBox.textContent = err.friendly ? `⚠️ ${err.message}` : "⚠️ حدث خطأ أثناء تسجيل الدخول، حاول مرة أخرى.";
                errorBox.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = "دخول";
            }
        });
    </script>
</body>
</html>
