<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>(function(){try{var t=localStorage.getItem('zimam_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الترع — منصة زمام الجيزة</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/01-tokens.css" />
    <link rel="stylesheet" href="../css/02-components.css" />
    <link rel="stylesheet" href="../css/03-app-components.css" />
    <link rel="stylesheet" href="../css/05-responsive.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="offline-banner" id="offline-banner"><span id="offline-icon"></span> لا يوجد اتصال بالإنترنت الآن — يمكنك المتابعة وستتم المزامنة تلقائياً عند رجوع الاتصال</div>
    <div id="admin-shell"></div>
    <div id="system-toast" class="toast"></div>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box"><h3 id="modal-title"></h3><p id="modal-message"></p><div class="modal-actions" id="modal-actions"></div></div>
    </div>

    <main class="admin-main">
        <h1 id="page-title"></h1>
        <p style="color:var(--text-muted); margin:6px 0 20px; font-size:0.85rem;">
            الأورنيك الهندسي وحالة التطهير لكل ترعة في مكان واحد.
        </p>

        <!-- ============ ملخّص سريع ============ -->
        <div class="mini-stats-grid" style="margin-bottom:20px;">
            <div class="stat-card" style="border-right:4px solid var(--danger);" onclick="filterCanalsByStatus('حرجة')" title="اضغط لعرض الترع الحرجة فقط">
                <div class="stat-info"><h4>حرجة</h4><div class="val" style="color:var(--danger);" id="canals-summary-critical">-</div></div>
                <div id="stat-icon-canal-critical"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--warning);" onclick="filterCanalsByStatus('جاري التطهير')" title="اضغط لعرض الترع الجاري تطهيرها">
                <div class="stat-info"><h4>جاري التطهير</h4><div class="val" style="color:var(--warning);" id="canals-summary-progress">-</div></div>
                <div id="stat-icon-canal-progress"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--success);" onclick="filterCanalsByStatus('تم التطهير')" title="اضغط لعرض الترع المُطهَّرة">
                <div class="stat-info"><h4>تم التطهير</h4><div class="val" style="color:var(--success);" id="canals-summary-done">-</div></div>
                <div id="stat-icon-canal-done"></div>
            </div>
            <div class="stat-card" style="border-right:4px solid var(--info,#2563eb);" onclick="filterCanalsByStatus('')" title="اضغط لعرض كل الترع">
                <div class="stat-info"><h4>الإجمالي</h4><div class="val" id="canals-summary-total">-</div></div>
                <div id="stat-icon-canal-total"></div>
            </div>
        </div>

        <!-- ============ جدول الترع (المحتوى الرئيسي) ============ -->
        <div class="card-box" style="margin-bottom:20px;">
            <div class="filter-bar" style="margin-bottom:14px;">
                <input type="text" id="filter-canal-search" placeholder="بحث..." oninput="renderCanalsDebounced()" />
                <select id="filter-canal-directorate" onchange="renderCanals()">
                    <option value="">كل الهندسات</option>
                    <option>هندسة ري مزغونة</option><option>هندسة ري العياط</option><option>هندسة ري الجيزة</option>
                    <option>هندسة ري المنصورية</option><option>هندسة ري إمبابة</option><option>هندسة ري الرياح</option>
                </select>
                <select id="filter-canal-rotation" onchange="renderCanals()">
                    <option value="">كل المناوبات</option>
                    <option value="أ">مناوبة أ</option><option value="ب">مناوبة ب</option><option value="جـ">مناوبة جـ</option>
                </select>
                <select id="filter-canal-status" onchange="renderCanals()">
                    <option value="">كل الحالات</option>
                    <option>لا تحتاج لتطهير</option><option>جاري التطهير</option>
                    <option>تم التطهير</option><option>حرجة</option>
                </select>
                <button class="btn-icon" id="btn-export-pdf" onclick="exportTableToPDF('canals-table','تقرير الترع (الأورنيك الهندسي وحالة التطهير)','تقرير_الترع')"></button>
                <button class="btn-icon" id="btn-export-excel" onclick="exportTableToExcel('canals-table','ترع')"></button>
                <button class="btn-icon" id="btn-import-excel" onclick="document.getElementById('excel-import-panel').classList.toggle('open')"></button>
                <span id="canals-filtered-count" style="font-size:0.78rem; color:var(--clay); white-space:nowrap; align-self:center;"></span>
            </div>

            <!-- لوحة استيراد Excel مطوية افتراضياً — عملية غير يومية، مالهاش داعي تاخد مساحة ثابتة -->
            <div class="excel-import-panel" id="excel-import-panel" style="margin-bottom:14px;">
                <button type="button" class="btn-icon" style="margin-bottom:10px;" onclick="downloadExcelTemplate('canals')" id="btn-download-template"></button>
                <label class="excel-drop-zone">
                    <div id="excel-drop-icon"></div>
                    <strong>اضغط لاختيار ملف Excel (.xlsx)</strong>
                    <p style="font-size:0.7rem;color:var(--clay);margin-top:6px;">الأعمدة: الترعة, الهندسة, الترعة المغذية, البر, الطول, الزمام, القنن المائي, الحالة, آخر تطهير, الموعد القادم, خط العرض, خط الطول, ملاحظات</p>
                    <input type="file" id="excel-file-input" accept=".xlsx,.xls" onchange="handleExcelImport(event)" />
                </label>
            </div>
            <div class="table-responsive table-card-view">
                <table id="canals-table">
                    <thead><tr>
                        <th>الترعة</th><th>الهندسة</th><th>الطول (كم)</th><th>الحالة</th><th>التبطين</th><th>آخر تطهير</th><th>إجراءات</th>
                    </tr></thead>
                    <tbody id="canals-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ============ زرار الإضافة العائم ============ -->
    <button class="fab-add-btn" id="fab-add-canal" onclick="openAddDialog()" title="إضافة ترعة"></button>

    <!-- ============ ديالوج إضافة/تعديل ترعة ============ -->
    <div class="form-dialog-overlay" id="form-dialog-overlay">
        <div class="form-dialog">
            <div class="form-dialog-head">
                <h3><span id="dialog-icon"></span> <span id="dialog-title">إضافة ترعة جديدة</span></h3>
                <button class="form-dialog-close" onclick="closeFormDialog()"></button>
            </div>
            <div class="form-dialog-body">
                <input type="hidden" id="cn-id" />

                <div class="form-section-label" id="fsl-basic"></div>
                <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-bottom:16px;">
                    <div><label style="font-size:0.75rem; font-weight:700;"><span class="required-star">*</span>اسم الترعة</label><input class="form-input" id="cn-name" placeholder="ترعة النيل الغربي" /></div>
                    <div>
                        <label style="font-size:0.75rem; font-weight:700;"><span class="required-star">*</span>الإدارة الهندسية</label>
                        <select class="form-input" id="cn-directorate">
                            <option value="">اختر الهندسة</option>
                            <option>هندسة ري مزغونة</option><option>هندسة ري العياط</option><option>هندسة ري الجيزة</option>
                            <option>هندسة ري المنصورية</option><option>هندسة ري إمبابة</option><option>هندسة ري الرياح</option>
                        </select>
                    </div>
                    <div><label style="font-size:0.75rem; font-weight:700;">الترعة المغذية</label><input class="form-input" id="cn-feeder" placeholder="ترعة الإبراهيمية" /></div>
                    <div><label style="font-size:0.75rem; font-weight:700;">البر</label><select class="form-input" id="cn-bank"><option value="">--</option><option>أيمن</option><option>أيسر</option></select></div>
                    <div><label style="font-size:0.75rem; font-weight:700;">الطول الكلي (كم)</label><input class="form-input" id="cn-length" type="number" placeholder="12.5" /></div>
                    <div><label style="font-size:0.75rem; font-weight:700;">الزمام (فدان)</label><input class="form-input" id="cn-command-area" type="number" placeholder="500" /></div>
                    <div><label style="font-size:0.75rem; font-weight:700;">القنن المائي (م³/فدان.يوم)</label><input class="form-input" id="cn-discharge" type="number" placeholder="55" /></div>
                    <div><label style="font-size:0.75rem; font-weight:700;">خط العرض (GPS)</label><input class="form-input" id="cn-lat" type="number" step="0.000001" /></div>
                    <div><label style="font-size:0.75rem; font-weight:700;">خط الطول (GPS)</label><input class="form-input" id="cn-lng" type="number" step="0.000001" /></div>
                    <div style="display:flex; align-items:flex-end;"><button type="button" class="btn-gps" id="btn-gps-canal" onclick="captureGPSSeparate('cn-lat','cn-lng','btn-gps-canal')" style="width:100%;"></button></div>
                </div>

                <div class="form-section-label" id="fsl-status"></div>
                <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-bottom:16px;">
                    <div>
                        <label style="font-size:0.75rem; font-weight:700;">الحالة</label>
                        <select class="form-input" id="cn-status">
                            <option>لا تحتاج لتطهير</option><option>جاري التطهير</option>
                            <option>تم التطهير</option><option>حرجة</option>
                        </select>
                    </div>
                    <div><label style="font-size:0.75rem; font-weight:700;">تاريخ آخر تطهير</label><input class="form-input" id="cn-last-date" type="date" /></div>
                    <div><label style="font-size:0.75rem; font-weight:700;">الموعد القادم المُجدوَل</label><input class="form-input" id="cn-next-date" type="date" /></div>
                </div>

                <div class="form-section-label" id="fsl-sections"></div>
                <div id="cn-sections-editor" style="margin-bottom:10px;"></div>
                <button type="button" class="btn-icon" id="btn-add-section" onclick="addSectionRow()" style="margin-bottom:16px;"></button>

                <div class="form-section-label" id="fsl-lining"></div>
                <label class="check-row" style="margin-bottom:10px; display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="cn-is-lined" onchange="toggleLiningFields()" /> هل الترعة مُبطَّنة؟
                </label>
                <div id="cn-lining-fields" style="display:none; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-bottom:16px;">
                    <div><label style="font-size:0.75rem; font-weight:700;">نوع التبطين</label><input class="form-input" id="cn-lining-type" placeholder="خرسانة مسلحة" /></div>
                    <div><label style="font-size:0.75rem; font-weight:700;">الطول المُبطَّن (كم)</label><input class="form-input" id="cn-lined-length" type="number" /></div>
                </div>

                <div><label style="font-size:0.75rem; font-weight:700;">ملاحظات</label><textarea class="form-input" id="cn-notes" rows="2"></textarea></div>
            </div>
            <div class="form-dialog-foot">
                <button class="btn-submit" id="btn-save-canal" style="flex:1;" onclick="saveCanal()"></button>
                <button class="btn-icon" id="btn-cancel-edit-canal" style="display:none;" onclick="cancelEditCanal()">إلغاء التعديل</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth } from "../js/auth.js";
        import { initTheme, renderAdminShell } from "../js/shared.js";
        import { debounce, updateOnlineStatus } from "../js/utils/ui-helpers.js";
        import { exportTableToPDF } from "../js/utils/pdf-export.js";
        import { exportTableToExcel, downloadExcelTemplate } from "../js/utils/excel-export.js";
        import {
            saveCanal, cancelEditCanal, editCanalTrigger, deleteCanal,
            renderCanals, filterCanalsByStatus, viewCanalDetail, handleExcelImport,
            addSectionRow, removeSectionRow, updateSectionField, renderSectionsEditor, toggleLiningFields,
            initCanalsListener,
        } from "../js/data/canals.js";
        import { icon } from "../js/icons.js";
        import { captureGPSSeparate } from "../js/utils/gps.js";

        document.getElementById("page-title").innerHTML = `${icon("tractor", 24)} الترع`;
        document.getElementById("stat-icon-canal-critical").innerHTML = icon("warning", 22);
        document.getElementById("stat-icon-canal-progress").innerHTML = icon("activity", 22);
        document.getElementById("stat-icon-canal-done").innerHTML = icon("check", 22);
        document.getElementById("stat-icon-canal-total").innerHTML = icon("tractor", 22);
        document.getElementById("btn-export-pdf").innerHTML = icon("pdf", 17);
        document.getElementById("btn-export-excel").innerHTML = icon("excel", 17);
        document.getElementById("btn-import-excel").innerHTML = icon("upload", 17);
        document.getElementById("btn-download-template").innerHTML = `${icon("save", 15)} تحميل قالب Excel فاضي للتعبئة`;
        document.getElementById("excel-drop-icon").innerHTML = icon("excel", 32);
        document.getElementById("fab-add-canal").innerHTML = icon("plus", 24);
        document.getElementById("dialog-icon").innerHTML = icon("tractor", 18);
        document.querySelector(".form-dialog-close").innerHTML = icon("close", 18);
        document.getElementById("fsl-basic").innerHTML = "البيانات الأساسية";
        document.getElementById("fsl-status").innerHTML = "حالة التطهير";
        document.getElementById("fsl-sections").innerHTML = "المقاطع الهندسية وبيانات المناوبة";
        document.getElementById("fsl-lining").innerHTML = "التبطين";
        document.getElementById("btn-add-section").innerHTML = `${icon("plus", 15)} إضافة مقطع هندسي`;
        document.getElementById("btn-save-canal").innerHTML = `${icon("save", 16)} حفظ`;
        document.getElementById("btn-gps-canal").innerHTML = `${icon("location", 15)} تحديد الموقع`;

        document.getElementById("offline-icon").innerHTML = icon("warning", 15);
        initTheme();
        updateOnlineStatus();
        window._loaded = window._loaded || {};
        window.canalsCache = window.canalsCache || [];

        renderAdminShell("canals"); // فوري بدون بيانات — يلغي الوميض
        const profile = await requireAuth();
        renderAdminShell("canals", profile); // تحديث بالبيانات الحقيقية

        window.openAddDialog = function () {
            cancelEditCanal();
            document.getElementById("dialog-title").textContent = "إضافة ترعة جديدة";
            document.getElementById("form-dialog-overlay").classList.add("open");
        };
        window.closeFormDialog = function () {
            document.getElementById("form-dialog-overlay").classList.remove("open");
        };

        Object.assign(window, {
            saveCanal, cancelEditCanal, editCanalTrigger, deleteCanal,
            renderCanals, filterCanalsByStatus, viewCanalDetail, handleExcelImport,
            addSectionRow, removeSectionRow, updateSectionField, toggleLiningFields,
            exportTableToPDF, exportTableToExcel, downloadExcelTemplate, captureGPSSeparate,
            renderCanalsDebounced: debounce(renderCanals),
        });

        renderSectionsEditor();
        initCanalsListener();
    </script>
</body>
</html>
